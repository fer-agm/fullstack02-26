<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Lo quieres, te lo vendo</title>

  <!-- Bootstrap 5 CSS y Material Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="assets/style.css" rel="stylesheet">
</head>

<body>  
  <!-- Navegación -->
  <nav class="navbar navbar-expand-lg bg-custom-blue navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">LQLV</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTolXxTfyvDWdxU1NCC3sSMii_TruMfpuM59MAqrv5bTQ&s=10" target="_blank">Conoce más de nosotros</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <main>
    <section class="py-5 text-center container">
      <div class="row py-lg-3">
        <div class="col-lg-8 col-md-10 mx-auto">
          <h1 class="fw-bold text-custom-dark-blue">¡Contáctanos!</h1>
          <p class="lead text-white mt-3">Escríbenos tu duda o pedido y te responderemos a la brevedad.</p>
        </div>
      </div>
    </section>
    
    <!-- Formulario -->
    <div class="container my-3">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 bg-white p-4 rounded shadow-sm">
          <form>
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label for="nombre" class="form-label font-weight-bold">Nombre completo</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="material-icons text-info">account_circle</i></span>
                  <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                </div>
              </div>

              <div class="col-12 col-md-6">
                <label for="email" class="form-label">Correo electrónico</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="material-icons text-info">email</i></span>
                  <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com" required>
                </div>
              </div>

              <div class="col-12">
                <label for="mensaje" class="form-label">Tu mensaje o consulta</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="material-icons text-info">mode_edit</i></span>
                  <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe aquí tu consulta..." required></textarea>
                </div>
              </div>

              <div class="col-12 text-center mt-4">
                <button type="submit" class="btn btn-info text-white btn-lg px-5">
                  Enviar Mensaje <i class="material-icons align-middle ms-1">send</i>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-custom-blue text-white py-4">
    <div class="container">
      <div class="row">
        <div class="col-12 col-md-6 mb-3 mb-md-0">
          <h5>Información</h5>
          <p class="mb-0 text-white-50">Fernanda Gajardo // Semestre 2 - año 2026</p>  
        </div>
        <div class="col-12 col-md-4 offset-md-2">
          <h5>Repositorio Github</h5>
          <ul class="list-unstyled">
            <li><a class="text-white-50 text-decoration-none" href="https://github.com/fer-agm/fullstack02-26" target="_blank">Repositorio Github</a></li>
          </ul>
        </div>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
